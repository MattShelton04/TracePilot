# Lefthook — Git hooks manager
# Install: pnpm install && pnpm hooks:install (explicit opt-in). That points
# core.hooksPath at the tracked shims in scripts/git-hooks/, which run the
# lefthook from the current worktree's node_modules. Don't run
# `lefthook install`; see CONTRIBUTING.md ("Git hooks").
# Keep `run:` lines to a plain command plus file templates: on Windows,
# lefthook re-tokenizes them, so shell quoting, `$(...)` and multi-line
# scripts break. Put logic in a script instead.
# See https://github.com/evilmartians/lefthook

# The tracked shims are the hooks; never let lefthook rewrite them.
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    # Biome: lint + format check on staged JS/TS/Vue/JSON.
    # Auto-generated bindings are excluded (also honoured by biome.json).
    biome:
      glob: "*.{ts,tsx,vue,js,jsx,mjs,json}"
      exclude: "packages/client/src/generated/.*"
      run: npx @biomejs/biome check --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    # rustfmt on staged .rs files only — per-file invocation avoids a full
    # `cargo fmt --all` sweep on every commit.
    rustfmt:
      glob: "*.rs"
      run: rustfmt --check --edition 2024 {staged_files}
    # File-size budgets on staged files only. The full sweep takes seconds
    # and runs in CI.
    filesize:
      glob: "*.{rs,vue,ts,tsx,js,mjs}"
      run: node scripts/check-file-sizes.mjs --staged
    # Doc-link lint on staged markdown only. Full sweep runs in `just ci`.
    doc-links:
      glob: "*.md"
      run: node scripts/check-doc-links.mjs {staged_files}
    # ADR template lint — cheap, run full set since there are <20 ADRs.
    adr:
      glob: "docs/adr/*.md"
      run: node scripts/check-adr.mjs
    # CSP regression guard — only when the Tauri config is staged.
    csp:
      glob: "apps/desktop/src-tauri/tauri.conf.json"
      run: node scripts/check-csp.mjs
    # Public-API drift guard for tracepilot-orchestrator (FU-10).
    public-api:
      glob: "crates/tracepilot-orchestrator/src/lib.rs"
      run: node scripts/check-public-api.mjs
    # Design-system guard-rails (design-system/MASTER.md §6).
    # Each script accepts --staged for incremental enforcement.
    ds-hex:
      glob: "apps/desktop/src/**/*.{vue,css,scss}"
      run: node scripts/check-no-hex-colors.mjs --staged
    ds-emoji:
      glob: "apps/desktop/src/**/*.vue"
      run: node scripts/check-no-emoji-in-templates.mjs --staged
    ds-backdrop:
      glob: "apps/desktop/src/**/*.{vue,css,scss}"
      run: node scripts/check-no-backdrop-filter.mjs --staged
    ds-zindex:
      glob: "apps/desktop/src/**/*.{vue,css}"
      run: node scripts/check-z-index-tokens.mjs --staged

# Heavier checks, scoped to what the branch changed since origin/main:
# file sizes, rustfmt on changed .rs files, and typecheck of the changed
# packages plus their dependents. CI runs everything in full. Skip with
# `git push --no-verify` if urgent.
pre-push:
  commands:
    changed:
      run: node scripts/git-hooks/pre-push-checks.mjs

commit-msg:
  commands:
    conventional-commit:
      # Git supplies its own merge message; validate ordinary commits only.
      skip: merge
      run: node scripts/check-commit-msg.mjs {1}

# Named "fix" bundle — run manually with `lefthook run fix` for a one-shot
# auto-fix pass. Intentionally NOT wired to any git hook.
fix:
  commands:
    biome-fix:
      run: npx @biomejs/biome check --write .
    rustfmt-fix:
      run: cargo fmt --all
    clippy-fix:
      run: cargo clippy --workspace --exclude tracepilot-desktop --all-targets --fix --allow-dirty --allow-staged
