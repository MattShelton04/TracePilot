[package]
name = "tracepilot-orchestrator"
description = "Orchestration capabilities: worktrees, session launching, config injection, version management"
version.workspace = true
edition.workspace = true
license.workspace = true

# The official `github-copilot-sdk` crate is always compiled in — see
# ADR-0007 and ADR-0015. Availability at runtime is gated by the
# `FeaturesConfig.copilot_sdk` user preference via a reader threaded
# into `BridgeManager`; when the preference is off, bridge start
# methods return `BridgeError::DisabledByPreference`.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
semver = { workspace = true }
tracepilot-core = { path = "../tracepilot-core" }
tracepilot-export = { path = "../tracepilot-export" }

tokio = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
# The bounded capture endpoint accepts raw bytes; no JSON/form/query extractors.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "tracing", "tower-log"] }

similar = "2"
walkdir = "2"
regex = "1"
once_cell = "1"
sha2 = { workspace = true }
url = "2"

github-copilot-sdk = { workspace = true }

# Phase 1B.1 codegen pilot: derive `specta::Type` on `BridgeMetricsSnapshot`
# so tauri-specta can emit a TS mirror. Zero runtime cost.
specta = { workspace = true, features = ["derive"] }
tracepilot-workspace-hack = { version = "0.1", path = "../tracepilot-workspace-hack" }

# `process::process_start_time` reads a process's creation time in-process
# instead of spawning PowerShell for each pid.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
