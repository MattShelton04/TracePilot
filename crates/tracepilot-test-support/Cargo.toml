[package]
name = "tracepilot-test-support"
description = "Shared test-only helpers and fixtures for the TracePilot workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Fixture helpers need tempfile, plus serde_json for golden snapshots and
# synthetic Claude Code transcripts (test-only crate pinned via the
# workspace). Consumers that want
# analytics/export builders can depend on the relevant internal crate
# directly; feature-gated internal deps are added here when those
# migrations land.
tempfile = { workspace = true }
serde_json = { workspace = true }
tracepilot-workspace-hack = { version = "0.1", path = "../tracepilot-workspace-hack" }

[lints]
workspace = true
