name: Benchmark Comparison

# Same-runner base-vs-head performance comparison for backend changes.
#
# Absolute timings from shared runners vary too much between machines to be a
# regression signal, so both revisions are measured on this one runner, back
# to back:
#   1. Criterion: the base revision saves a baseline, the head revision is
#      compared against it (`--baseline-lenient`); verdicts need the whole
#      confidence interval of the mean change beyond +/-10%.
#   2. index_probe: base and head builds alternate (ABBA) over a generated
#      1,000-session corpus, reporting wall time and peak memory for the
#      indexing pipeline, incremental search passes and the analytics
#      disk-scan fallback, which Criterion cannot measure.
# Results are advisory annotations and a job summary; the job fails only when
# the tooling itself fails.
#
# The probe lane runs on every PR that touches Rust (~5 min). The Criterion
# lane runs two full benchmark suites (~25 min), so it is opt-in: add the
# `benchmark:criterion` label to a PR, or run this workflow manually.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base revision (blank compares against the first parent)
        required: false
        default: ''
      criterion:
        description: Also run the Criterion base-vs-head comparison (~25 min)
        type: boolean
        default: true
  pull_request:
    branches: [main]
    # `labeled` lets adding the Criterion label start a run.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'scripts/ci/compare-refs*'
      - 'scripts/perf/criterion-compare*'
      - 'scripts/perf/probe-compare*'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/benchmark-compare.yml'

permissions:
  contents: read

concurrency:
  group: benchmark-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare base and head performance
    # Ignore label events other than the Criterion opt-in.
    if: github.event.action != 'labeled' || github.event.label.name == 'benchmark:criterion'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_DIR: ${{ github.workspace }}/../base
      HEAD_DIR: ${{ github.workspace }}/../head
      # Shorter windows keep two full runs within budget; the confidence
      # interval (not the point estimate) decides verdicts.
      CRITERION_ARGS: --noplot --warm-up-time 1 --measurement-time 3
      RUN_CRITERION: ${{ (github.event_name == 'workflow_dispatch' && inputs.criterion) || contains(github.event.pull_request.labels.*.name, 'benchmark:criterion') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: benchmark-release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify comparison tooling
        run: node --test scripts/perf/criterion-compare.test.mjs scripts/perf/probe-compare.test.mjs scripts/ci/compare-refs.test.mjs

      - name: Select comparison commits
        id: refs
        run: node scripts/ci/compare-refs.mjs

      - name: Check out measured revisions
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base || steps.refs.outputs.base }}
          HEAD_REF: ${{ steps.refs.outputs.head }}
        run: |
          git worktree add --detach "$BASE_DIR" "$BASE_REF"
          git worktree add --detach "$HEAD_DIR" "$HEAD_REF"
          base_sha=$(git -C "$BASE_DIR" rev-parse HEAD)
          head_sha=$(git -C "$HEAD_DIR" rev-parse HEAD)
          if [[ "$base_sha" == "$head_sha" ]]; then
            echo "::error::Select a base revision different from the measured head."
            exit 1
          fi
          echo "Base: $base_sha  Head: $head_sha" >> "$GITHUB_STEP_SUMMARY"
          # Apply the same harness to both revisions, including older PR heads
          # that predate the probe's compile-time revision attestation.
          for revision_dir in "$BASE_DIR" "$HEAD_DIR"; do
            mkdir -p "$revision_dir/crates/tracepilot-bench/examples/index_probe"
            cp crates/tracepilot-bench/examples/index_probe.rs "$revision_dir/crates/tracepilot-bench/examples/"
            cp crates/tracepilot-bench/examples/index_probe/limits.rs "$revision_dir/crates/tracepilot-bench/examples/index_probe/"
          done

      - name: Build probes and generate corpus
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # Each probe builds into its own target directory. Cargo does not
          # re-copy an up-to-date example into release/examples, so a shared
          # (or cache-restored) directory can hand back the other revision's
          # binary without any error.
          # rust-cache keeps dependency artifacts in target/release. Seed both
          # isolated targets from that single main cache instead of compiling
          # every dependency twice. No new PR-scoped caches are saved.
          for variant in base head; do
            mkdir -p "$RUNNER_TEMP/target-$variant/release"
            if [[ -d target/release ]]; then
              cp -a target/release/. "$RUNNER_TEMP/target-$variant/release/"
            fi
            # Never seed an example binary or workspace crate. Explicit clean
            # also protects this contract if the shared cache policy changes.
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-$variant" cargo clean --release \
              -p tracepilot-bench -p tracepilot-core -p tracepilot-indexer
            rm -rf "$RUNNER_TEMP/target-$variant/release/examples"
          done
          (cd "$BASE_DIR" && TRACEPILOT_PROBE_REVISION="$(git rev-parse HEAD)" CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" cargo build --locked --release -p tracepilot-bench --example index_probe)
          (cd "$HEAD_DIR" && TRACEPILOT_PROBE_REVISION="$(git rev-parse HEAD)" CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" cargo build --locked --release -p tracepilot-bench --example index_probe --example performance_probe)
          cp "$RUNNER_TEMP/target-base/release/examples/index_probe" "$RUNNER_TEMP/bin/index_probe-base"
          cp "$RUNNER_TEMP/target-head/release/examples/index_probe" "$RUNNER_TEMP/bin/index_probe-head"
          "$RUNNER_TEMP/target-head/release/examples/performance_probe" \
            generate --root "$RUNNER_TEMP/corpus" --scale large

      - name: Compare backend phases (wall time and peak memory)
        run: |
          node scripts/perf/probe-compare.mjs \
            --base="$RUNNER_TEMP/bin/index_probe-base" \
            --head="$RUNNER_TEMP/bin/index_probe-head" \
            --base-sha="$(git -C "$BASE_DIR" rev-parse HEAD)" \
            --head-sha="$(git -C "$HEAD_DIR" rev-parse HEAD)" \
            --sessions="$RUNNER_TEMP/corpus/copilot/session-state" \
            --work="$RUNNER_TEMP/probe-work" \
            --repeats=6 \
            --corpus="the 1,000-session 'large' synthetic corpus" \
            --output=probe-compare.json \
            --summary=probe-compare.md
          cat probe-compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Criterion baseline (base revision)
        if: env.RUN_CRITERION == 'true'
        run: |
          # Saved measurements must come only from this comparison's base run.
          rm -rf target/criterion
          read -r -a criterion_args <<< "$CRITERION_ARGS"
          (cd "$BASE_DIR" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench --locked -p tracepilot-bench --bench '*' -- --save-baseline pr-base "${criterion_args[@]}")

      - name: Criterion comparison (head revision)
        if: env.RUN_CRITERION == 'true'
        run: |
          # Keep Criterion's data baseline, but rebuild local code from head.
          cargo clean --release -p tracepilot-bench -p tracepilot-core -p tracepilot-indexer
          read -r -a criterion_args <<< "$CRITERION_ARGS"
          (cd "$HEAD_DIR" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench --locked -p tracepilot-bench --bench '*' -- --baseline-lenient pr-base "${criterion_args[@]}")

      - name: Summarise Criterion comparison
        if: env.RUN_CRITERION == 'true'
        run: |
          node scripts/perf/criterion-compare.mjs \
            --criterion=target/criterion \
            --baseline=pr-base \
            --output=benchmark-compare.json \
            --summary=benchmark-compare.md
          cat benchmark-compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-compare-${{ github.run_number }}
          path: |
            probe-compare.json
            probe-compare.md
            benchmark-compare.json
            benchmark-compare.md
          if-no-files-found: warn
          retention-days: 30
