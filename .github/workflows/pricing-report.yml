name: Copilot Pricing Report

on:
  workflow_run:
    workflows: [Copilot Pricing Freshness]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pricing-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  queue: max
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      # Execute only trusted default-branch code with write permissions. PR
      # artifacts are bounded JSON data, never scripts or pre-rendered Markdown.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test trusted report formatting and comment behavior
        run: node --test scripts/pricing/report.test.mjs scripts/ci/report-comment.test.mjs
      - name: Download data from this freshness run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: copilot-pricing-freshness
          path: ${{ runner.temp }}/pricing-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create or update the pricing advisory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRICING_REPORT_DIR: ${{ runner.temp }}/pricing-report
        run: node scripts/pricing/publish.mjs
