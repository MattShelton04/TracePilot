name: Desktop Visual Capture

on:
  pull_request:
    branches: [main]
    paths: ['apps/desktop/**', 'packages/**', 'scripts/visual/**', 'scripts/ci/**', '.github/actions/setup-node-pnpm/**', '.github/workflows/visual-*.yml', '.node-version', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'packages/**', 'scripts/visual/**', 'scripts/ci/**', '.github/actions/setup-node-pnpm/**', '.github/workflows/visual-*.yml', '.node-version', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
  workflow_dispatch:

# PR code, including fork dependencies/configuration, runs ONLY with read access.
permissions:
  contents: read

concurrency:
  group: visual-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: ${{ matrix.revision }} screenshots (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
        shard: [1, 2]
    steps:
      # Use the workflow revision (the PR merge commit) for the shared harness.
      # It includes helpers added on main even when the PR head predates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: harness/.node-version
          package-manager-cache: false
      - name: Select PR merge base or previous main revision
        id: refs
        run: node harness/scripts/ci/compare-refs.mjs harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'base' && steps.refs.outputs.base || steps.refs.outputs.head }}
          path: app
          persist-credentials: false
      - uses: ./harness/.github/actions/setup-node-pnpm
        with:
          working-directory: app
      - name: Install shared head browser harness
        working-directory: harness
        run: pnpm install --frozen-lockfile --filter tracepilot --ignore-scripts
      - name: Install lockfile-pinned Chromium
        run: node harness/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Harness policy tests
        run: |
          npm ci --prefix harness/scripts/visual --ignore-scripts --no-audit --no-fund
          node --test harness/scripts/visual/*.test.mjs
          node --test harness/scripts/ci/*.test.mjs
          python3 harness/scripts/visual/extract_test.py
      - name: Capture real frontend routes with synthetic backend fixtures
        env:
          VISUAL_REVISION_SHA: ${{ matrix.revision == 'base' && steps.refs.outputs.base || steps.refs.outputs.head }}
        run: node harness/scripts/visual/capture.mjs --root=app --out=captures --shard=${{ matrix.shard }}/2 --revision=${{ matrix.revision }}
      - name: Verify gallery without browser canvas extraction
        if: matrix.revision == 'head' && matrix.shard == 1
        run: node harness/scripts/visual/gallery-check.mjs
      - name: Retain captures and explicit failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ matrix.revision }}-${{ matrix.shard }}
          path: captures/
          if-no-files-found: warn
          retention-days: 14
