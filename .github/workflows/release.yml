name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v0.7.1)'
        required: true
        type: string
      draft:
        description: 'Leave the completed release as a draft'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Manual releases must build the requested existing tag, not whichever
      # branch was selected in the Actions UI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Record the immutable release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        shell: bash
        run: |
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
              print(next(p['version'] for p in d['packages'] if p['name']=='tracepilot-desktop'))")
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$CARGO_VER" != "$PKG_VER" ] || [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::Version mismatch: Cargo=$CARGO_VER, package.json=$PKG_VER, tag=$TAG_VER"
            exit 1
          fi
          echo "Version OK: $CARGO_VER"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SECTION=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            SECTION="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for details."
          fi
          {
            echo "body<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Always create a draft first. A failed installer build must not leave a
      # published release with missing assets.
      - name: Create draft GitHub release
        id: create
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "TracePilot v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

  build-installers:
    name: Build and upload Windows installers
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # The previous shared debug cache restored ~771 MB but release
      # dependencies were still compiled from scratch. Avoid that transfer.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: -- --locked

      - name: Upload standalone exe
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: target/release/tracepilot-desktop.exe
          fail_on_unmatched_files: true
          draft: true

  # Apple Silicon only (see ADR 0010). The bundle is ad-hoc signed through
  # tauri.conf.json because there is no Developer ID, so users approve the
  # first launch in Privacy & Security. In-app updates are not quarantined
  # and install without that prompt.
  build-macos:
    name: Build and upload macOS app
    needs: create-release
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      # latest.json is written once, by the Windows job and then the
      # updater-manifest job. tauri-action merges it with a read, delete and
      # upload, so two jobs writing it concurrently can drop a platform.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          args: -- --locked

      - name: Verify, install from disk image, and launch
        run: bash scripts/macos/bundle-smoke.sh

      - name: Upload macOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-smoke-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .tracepilot/macos-smoke/*.txt
            .tracepilot/macos-smoke/*.log
            .tracepilot/macos-smoke/*.png
            .tracepilot/macos-smoke/data root/logs/

  # Adds the macOS entries to the latest.json the Windows job uploaded. URLs use
  # the API asset form, like tauri-action's, because browser download URLs
  # change when a draft is published.
  updater-manifest:
    name: Add macOS to updater manifest
    needs: [create-release, build-installers, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge darwin-aarch64 into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[] | {id, name}' | jq -s .)
          only() {
            jq -r --arg want "$1" --arg mode "$2" '
              [.[] | select(if $mode == "suffix" then (.name | endswith($want)) else .name == $want end)]
              | if length == 1 then .[0].id
                else error("expected one release asset matching \($want), found \(length)") end' <<<"$assets"
          }
          download() {
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$1"
          }
          manifest_id=$(only latest.json exact)
          tarball_id=$(only .app.tar.gz suffix)
          signature_id=$(only .app.tar.gz.sig suffix)

          download "$manifest_id" > latest.json
          signature=$(download "$signature_id")
          url="https://api.github.com/repos/$GH_REPO/releases/assets/$tarball_id"
          jq --arg signature "$signature" --arg url "$url" '
            .platforms["darwin-aarch64"] = {signature: $signature, url: $url}
            | .platforms["darwin-aarch64-app"] = {signature: $signature, url: $url}
          ' latest.json > merged.json
          jq -e '.platforms | has("windows-x86_64") and has("darwin-aarch64")' merged.json > /dev/null \
            || { echo "::error::Merged latest.json is missing a platform"; exit 1; }
          jq '.platforms | keys' merged.json

          gh api -X DELETE "repos/$GH_REPO/releases/assets/$manifest_id"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @merged.json \
            "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null

  # Pushed prerelease tags (v1.2.3-1) stay drafts so a release can be
  # rehearsed and its assets tested before anything is published. MSI only
  # accepts a numeric prerelease, so rehearsal versions look like 1.2.3-1.
  # The event check on the manual branch matters: on a push `inputs.draft` is
  # null, and GitHub's loose comparison treats `null == false` as true.
  publish-release:
    name: Publish completed release
    needs: [create-release, build-installers, build-macos, updater-manifest]
    if: >-
      (github.event_name == 'push' && !contains(needs.create-release.outputs.version, '-'))
      || (github.event_name == 'workflow_dispatch' && inputs.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          BUILD_SHA: ${{ needs.create-release.outputs.sha }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          if [ "$tag_sha" != "$BUILD_SHA" ]; then
            echo "::error::Release tag moved after validation; refusing to publish different source."
            exit 1
          fi
          gh release edit "$TAG" --draft=false
