name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # OS-neutral frontend work runs on Linux only. Build/typecheck and tests
  # are independent so they run in parallel for faster PR feedback.
  frontend_build:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend build
        # Typecheck already ran above; the package build script repeats vue-tsc.
        run: pnpm --filter @tracepilot/desktop exec vite build

      # Biome also checks formatting, which is intentionally advisory.
      - name: Frontend lint and format (advisory)
        continue-on-error: true
        run: pnpm biome check --error-on-warnings .

  frontend_test:
    name: frontend (workspace tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is the sole pnpm-cache writer. PRs and every other job restore
      # the latest matching cache from main without creating PR caches.
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-cache: "true"

      - name: Workspace package and CLI tests
        # Explicit filters include the root package unless excluded; its test
        # script would recursively run the entire workspace (including desktop).
        run: pnpm --filter '!tracepilot' --filter '!@tracepilot/desktop' -r test

  # Desktop's 291 test files previously waited for the workspace dependency
  # suites, then ran for ~166 seconds. Preserve isolation and split by file.
  desktop_test:
    name: frontend (desktop tests ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Desktop tests
        run: pnpm --filter @tracepilot/desktop test --shard=${{ matrix.shard }}/3

  # Cross-platform coverage remains for Rust, where platform-specific
  # filesystem/process behavior matters. Frontend work is not duplicated.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS remains disabled while timing-sensitive tests are flaky there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          components: ${{ runner.os == 'Linux' && 'clippy' || '' }}
          cache-key: ci-debug
          # The action also checks that the ref is main, so PRs are restore-only.
          save-cache: "true"

      - uses: ./.github/actions/setup-tauri-linux
        if: runner.os == 'Linux'

      # `cargo test` already compiles the tested workspace targets, so a
      # preceding serial `cargo check` only delayed the same feedback.
      - name: Rust tests
        run: cargo test --workspace --exclude tracepilot-desktop

      # Validate performance plans and the native E2E corpus on both OSes.
      - name: Performance fixture contracts
        run: |
          cargo test -p tracepilot-bench --example performance_probe
          cargo test -p tracepilot-bench --example e2e_fixture

      - name: Rust lint (clippy, advisory)
        if: runner.os == 'Linux'
        # The current branch has a pre-existing needless-range-loop warning.
        # Keep this visible without turning this PR into lint cleanup.
        continue-on-error: true
        run: cargo clippy --workspace --exclude tracepilot-desktop --all-targets -- -D warnings

  desktop_e2e:
    name: desktop integration (Windows installer)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Native automation lifecycle contracts
        run: pnpm test:automation
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-release
          save-cache: "true"
      - name: Build, install, exercise, and uninstall native app
        run: pnpm test:e2e -Install
      - name: Upload native integration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            .tracepilot/e2e-results/installation.json
            .tracepilot/e2e-results/results.xml
            .tracepilot/e2e-results/report/
            .tracepilot/e2e-results/tests/**/native/*.log
            .tracepilot/e2e-results/tests/**/native/*.json
            .tracepilot/e2e-results/tests/**/native/*.png
            .tracepilot/e2e-results/tests/**/native/*.zip
            .tracepilot/e2e-results/tests/**/native/*.yml
            .tracepilot/e2e-results/tests/**/native/lifecycle/*.json
            .tracepilot/e2e-results/tests/**/native/lifecycle/*.log
            .tracepilot/e2e-results/tests/**/native/data root/logs/
            .tracepilot/e2e-results/tests/**/native/data root/fixture.json
            .tracepilot/e2e-results/tests/**/native/data root/tracepilot/config.toml

  # Fast repository-policy checks do not need dependency installation or
  # native Tauri packages.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"

      - name: Check version consistency
        shell: bash
        run: |
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
              print(next(p['version'] for p in d['packages'] if p['name']=='tracepilot-desktop'))")
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$CARGO_VER" != "$PKG_VER" ]; then
            echo "::error::Version mismatch: Cargo=$CARGO_VER, package.json=$PKG_VER"
            exit 1
          fi
          echo "Version OK: $CARGO_VER"

      - name: Rust format (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: File size budgets
        run: node scripts/check-file-sizes.mjs

      - name: Performance reporting contracts
        run: |
          node --test scripts/perf/*.test.mjs scripts/ci/*.test.mjs
          node --check scripts/perf/indexing.mjs

      - name: Workflow action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-workflow-actions.mjs --verify-remote

  # Audits only need the lockfiles and their own action/tooling. Avoid
  # restoring build caches or installing the dependency tree.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Rust security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm audit (production)
        run: pnpm audit --prod --audit-level=high
        # The current lockfile has high-severity transitive advisories.
        continue-on-error: true

  # Configure this single, stable check as required in the main ruleset.
  required:
    name: required
    if: always()
    needs: [frontend_build, frontend_test, desktop_test, desktop_e2e, rust, policy, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          FRONTEND_BUILD: ${{ needs.frontend_build.result }}
          FRONTEND_TEST: ${{ needs.frontend_test.result }}
          DESKTOP_TEST: ${{ needs.desktop_test.result }}
          DESKTOP_E2E: ${{ needs.desktop_e2e.result }}
          RUST: ${{ needs.rust.result }}
          POLICY: ${{ needs.policy.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          for result in "$FRONTEND_BUILD" "$FRONTEND_TEST" "$DESKTOP_TEST" "$DESKTOP_E2E" "$RUST" "$POLICY" "$SECURITY"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with result: $result"
              exit 1
            fi
          done
          echo "All required CI jobs passed."
