name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Classify the complete PR merge diff rather than relying on workflow-level
  # path filters, which leave a required check pending when no paths match.
  # Unknown paths and every main push retain the full application coverage.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select relevant CI jobs
        id: classify
        run: node scripts/ci/classify-changes.mjs

  # OS-neutral frontend work runs on Linux only. Build/typecheck and tests
  # are independent so they run in parallel for faster PR feedback.
  frontend_build:
    name: frontend (build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend build
        # Typecheck already ran above; the package build script repeats vue-tsc.
        run: pnpm --filter @tracepilot/desktop exec vite build

      - name: Frontend lint and format
        run: pnpm lint

      - name: Build and smoke-test standalone CLI
        run: |
          pnpm build:cli
          node --test scripts/cli/cli-smoke.test.mjs

  frontend_test:
    name: frontend (workspace tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sole Linux pnpm-cache writer; the native jobs warm the other OS stores.
      # PRs remain restore-only to preserve caches reusable by later branches.
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-cache: "true"

      - name: Workspace package and CLI tests
        # Explicit filters include the root package unless excluded; its test
        # script would recursively run the entire workspace (including desktop).
        run: pnpm --filter '!tracepilot' --filter '!@tracepilot/desktop' -r test

      - name: Copilot pricing snapshot consistency and updater tests
        run: |
          pnpm pricing:check
          pnpm test:pricing

  # Desktop's 291 test files previously waited for the workspace dependency
  # suites, then ran for ~166 seconds. Preserve isolation and split by file.
  desktop_test:
    name: frontend (desktop tests ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Desktop tests
        run: pnpm --filter @tracepilot/desktop test --shard=${{ matrix.shard }}/3

  # Cross-platform coverage remains for Rust, where platform-specific
  # filesystem/process behavior matters. Frontend work is not duplicated.
  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # macOS is tier 2 (ADR 0010) and some timing-sensitive tests were flaky
    # there, so its leg reports failures without failing `required`.
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          components: ${{ runner.os == 'Linux' && 'clippy' || '' }}
          cache-key: ci-debug
          # The action also checks that the ref is main, so PRs are restore-only.
          save-cache: "true"

      - uses: ./.github/actions/setup-tauri-linux
        if: runner.os == 'Linux'

      # `cargo test` already compiles the tested workspace targets, so a
      # preceding serial `cargo check` only delayed the same feedback.
      - name: Rust tests
        run: cargo test --locked --workspace --exclude tracepilot-desktop --no-fail-fast

      - name: Regenerate and verify TypeScript bindings
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -p tracepilot-tauri-bindings --bin gen-bindings
          git diff --exit-code -- packages/client/src/generated packages/types/src/generated

      # Keep workspace feature unification identical to the main test command.
      # Selecting only tracepilot-bench rebuilt core/indexer with different
      # features (~16 seconds on Windows). This also covers index_probe tests.
      - name: Performance fixture contracts
        run: cargo test --locked --workspace --exclude tracepilot-desktop --examples

      - name: Rust lint (clippy)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --exclude tracepilot-desktop --all-targets -- -D warnings

  # The app.ps1 lifecycle contracts need Windows but not a native build, so they
  # run beside the installer job instead of ahead of its build.
  automation_contracts:
    name: automation contracts (Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Native automation lifecycle contracts
        run: |
          New-Item -ItemType Directory -Force .tracepilot/automation-test-results | Out-Null
          pnpm test:automation 2>&1 | Tee-Object -FilePath .tracepilot/automation-test-results/tests.log
          exit $LASTEXITCODE
      - name: Upload automation contract diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-contracts-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: .tracepilot/automation-test-results/

  desktop_e2e:
    name: desktop integration (Windows installer)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # rust-cache keeps dependencies only, so every run recompiles the
      # workspace crates. With the shipping profile (codegen-units=1, thin LTO)
      # that took 6.5-10 minutes, mostly single-threaded LLVM work. This job
      # checks packaging, installation and native behaviour rather than shipping
      # codegen, so it uses Cargo's default release parallelism while keeping
      # opt-level 2 and strip. Set at job level so the rust-cache key includes
      # these values. Release builds are unaffected.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-cache: "true"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-release
          save-cache: "true"
      - name: Build, install, exercise, and uninstall native app
        run: pnpm test:e2e -Install
      - name: Upload native integration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            .tracepilot/e2e-results/installation.json
            .tracepilot/e2e-results/results.xml
            .tracepilot/e2e-results/report/
            .tracepilot/e2e-results/tests/**/native/*.log
            .tracepilot/e2e-results/tests/**/native/*.json
            .tracepilot/e2e-results/tests/**/native/*.png
            .tracepilot/e2e-results/tests/**/native/*.zip
            .tracepilot/e2e-results/tests/**/native/*.yml
            .tracepilot/e2e-results/tests/**/native/lifecycle/*.json
            .tracepilot/e2e-results/tests/**/native/lifecycle/*.log
            .tracepilot/e2e-results/tests/**/native/data root/logs/
            .tracepilot/e2e-results/tests/**/native/data root/fixture.json
            .tracepilot/e2e-results/tests/**/native/data root/tracepilot/config.toml

  # macOS is a tier-2 platform (ADR 0010): this lane is deliberately not in
  # `required`. It builds the ad-hoc signed app and disk image, installs from
  # the image and launches the app. WKWebView has no CDP endpoint, so the
  # Playwright journeys stay Windows-only. The disk image is uploaded for
  # manual testing on a Mac.
  macos_bundle:
    name: desktop bundle (macOS, non-blocking)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Same trade-off as desktop_e2e: packaging, not shipping codegen.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-cache: "true"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-release
          save-cache: "true"
      # Updater artifacts need the release signing key, which PRs never see.
      - name: Build app bundle and disk image
        run: pnpm tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      # Uploaded before the smoke test so a failing build can still be tried.
      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracepilot-macos-dmg-${{ github.run_attempt }}
          retention-days: 7
          path: target/release/bundle/dmg/*.dmg
      - name: Verify, install from disk image, and launch
        run: bash scripts/macos/bundle-smoke.sh
      - name: Upload macOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-smoke-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .tracepilot/macos-smoke/*.txt
            .tracepilot/macos-smoke/*.log
            .tracepilot/macos-smoke/*.png
            .tracepilot/macos-smoke/data root/logs/

  # Fast repository-policy checks do not need dependency installation or
  # native Tauri packages.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"

      - name: Check version consistency
        shell: bash
        run: |
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
              print(next(p['version'] for p in d['packages'] if p['name']=='tracepilot-desktop'))")
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$CARGO_VER" != "$PKG_VER" ]; then
            echo "::error::Version mismatch: Cargo=$CARGO_VER, package.json=$PKG_VER"
            exit 1
          fi
          echo "Version OK: $CARGO_VER"

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Install pinned cargo-hakari binary
        shell: bash
        run: |
          # Curl pins are maintained manually; see docs/testing.md#pinned-ci-binaries.
          archive="$RUNNER_TEMP/cargo-hakari.tar.gz"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/guppy-rs/guppy/releases/download/cargo-hakari-0.9.39/cargo-hakari-0.9.39-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "699a3193a9bd1a8d914b970d3f50f3385f24fbd8b1294d0c0ff31fbe7c2c9f48  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-hakari
          cargo hakari --version

      # A stale workspace-hack silently reintroduces duplicate dependency
      # builds between workspace, per-crate and desktop commands.
      - name: Workspace-hack freshness
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

      - name: Repository contract checks
        run: |
          node scripts/check-catalog-drift.mjs
          node scripts/check-csp.mjs
          node scripts/check-public-api.mjs
          # Keep the Site trigger/deploy contract checked even if filters drift.
          node --test scripts/site/workflow-contract.test.mjs

      - name: File size budgets
        run: node scripts/check-file-sizes.mjs

      - name: Design-system guard-rails
        run: |
          node scripts/check-no-hex-colors.mjs
          node scripts/check-no-emoji-in-templates.mjs
          node scripts/check-no-backdrop-filter.mjs
          node scripts/check-z-index-tokens.mjs

      - name: Documentation links and ADRs
        run: |
          node scripts/check-doc-links.mjs
          node scripts/check-adr.mjs

      - name: Performance reporting contracts
        run: |
          node --test scripts/perf/*.test.mjs scripts/ci/*.test.mjs
          node --check scripts/perf/indexing.mjs

      - name: Workflow action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-workflow-actions.mjs --verify-remote

      - name: Workflow syntax, expressions, and shell checks
        shell: bash
        run: |
          # Curl pins are maintained manually; see docs/testing.md#pinned-ci-binaries.
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          # GitHub supports concurrency.queue; actionlint 1.7.12 predates it.
          # Ignore only that diagnostic until the validator supports the field.
          "$RUNNER_TEMP/actionlint/actionlint" -color -pyflakes= \
            -ignore 'unexpected key "queue" for "concurrency" section'

  # Audits always run, including docs-only PRs: advisories change independently
  # of source. Install the official checksum-pinned scanner instead of compiling
  # cargo-audit from its changing dependency graph on every run (~3 minutes).
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # audit-check publishes a check for informational notices too. Without
      # this, a clean push audit can fail while trying to publish its report.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned cargo-audit binary
        shell: bash
        run: |
          # Curl pins are maintained manually; see docs/testing.md#pinned-ci-binaries.
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$archive"
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-audit"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-audit" --strip-components=1
          install -m 755 "$RUNNER_TEMP/cargo-audit/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version

      - name: Rust security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: pnpm audit (including development and build tools)
        run: pnpm audit --audit-level=high

      - name: Audit isolated visual publisher
        run: npm audit --prefix scripts/visual --package-lock-only --audit-level=high

  # Configure this single, stable check as required in the main ruleset.
  required:
    name: required
    if: always()
    needs: [changes, frontend_build, frontend_test, desktop_test, automation_contracts, desktop_e2e, rust, policy, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/classify-changes.mjs --verify-required
