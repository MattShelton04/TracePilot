name: Copilot Pricing Freshness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Copilot pricing freshness (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Network/upstream failures and stale prices do not block unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-filter: tracepilot
      - name: Compare with GitHub's latest published pricing source
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm pricing:freshness --report .tracepilot/pricing-freshness.json
      - name: Save freshness result for trusted reporting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pricing-freshness
          path: .tracepilot/pricing-freshness.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
