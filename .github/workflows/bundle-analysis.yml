name: Bundle Analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'perf-budget.json'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/workflows/bundle-analysis.yml'

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-analysis:
    name: Analyze Frontend Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Frontend bundle analysis does not need Rust or native Tauri packages.
      - uses: ./.github/actions/setup-node-pnpm

      - name: Build with bundle analysis
        run: pnpm --filter @tracepilot/desktop build --mode analyze

      - name: Measure bundle and enforce total-size budget
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          import pathlib
          import re
          import sys

          dist = pathlib.Path("apps/desktop/dist")
          assets = sorted(
              path for path in (dist / "assets").rglob("*")
              if path.is_file() and path.suffix in {".js", ".css"}
          )
          if not assets:
              raise SystemExit("::error::Bundle build produced no JS or CSS assets")

          budget_path = pathlib.Path("perf-budget.json")
          if not budget_path.is_file():
              raise SystemExit("::error::Missing required perf-budget.json")
          frontend = json.loads(budget_path.read_text(encoding="utf-8")).get("frontend")
          if not isinstance(frontend, dict):
              raise SystemExit("::error::Missing frontend performance budgets")
          required = ("totalBundleSizeKb", "largestChunkKb", "initialLoadChunks")
          for key in required:
              value = frontend.get(key)
              if not isinstance(value, (int, float)) or isinstance(value, bool) or value <= 0:
                  raise SystemExit(f"::error::frontend.{key} must be a positive number")

          rows = []
          for path in assets:
              content = path.read_bytes()
              rows.append({
                  "file": path.relative_to(dist).as_posix(),
                  "bytes": len(content),
                  "gzipBytes": len(gzip.compress(content, compresslevel=9, mtime=0)),
              })

          total_kb = sum(row["bytes"] for row in rows) / 1024
          largest = max(rows, key=lambda row: row["bytes"])
          largest_kb = largest["bytes"] / 1024
          index_html = (dist / "index.html").read_text(encoding="utf-8")
          initial_assets = sorted(set(re.findall(
              r'''(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']''',
              index_html,
          )))
          initial_count = len(initial_assets)

          report = {
              "schemaVersion": 1,
              "metrics": {
                  "totalBundleSizeKb": {
                      "actual": total_kb,
                      "budget": frontend["totalBundleSizeKb"],
                      "enforcement": "required",
                  },
                  "largestChunkKb": {
                      "actual": largest_kb,
                      "budget": frontend["largestChunkKb"],
                      "file": largest["file"],
                      "enforcement": "advisory",
                  },
                  "initialLoadChunks": {
                      "actual": initial_count,
                      "budget": frontend["initialLoadChunks"],
                      "files": initial_assets,
                      "enforcement": "advisory",
                  },
              },
              "assets": rows,
          }
          pathlib.Path("bundle-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )

          total_ok = total_kb <= frontend["totalBundleSizeKb"]
          largest_ok = largest_kb <= frontend["largestChunkKb"]
          initial_ok = initial_count <= frontend["initialLoadChunks"]
          lines = [
              "## Bundle analysis",
              "",
              "| Metric | Actual | Budget | Enforcement | Status |",
              "| --- | ---: | ---: | --- | --- |",
              f"| Total JS + CSS | {total_kb:.1f} KB | {frontend['totalBundleSizeKb']} KB | required | {'within' if total_ok else 'exceeded'} |",
              f"| Largest chunk (`{largest['file']}`) | {largest_kb:.1f} KB | {frontend['largestChunkKb']} KB | advisory | {'within' if largest_ok else 'exceeded (advisory)'} |",
              f"| Initial HTML JS/CSS assets | {initial_count} | {frontend['initialLoadChunks']} | advisory | {'within' if initial_ok else 'exceeded (advisory)'} |",
              "",
              "Largest-chunk and initial-asset thresholds are reported for review but are not CI gates.",
              "",
              "| File | Size (KB) | Gzipped (KB) |",
              "| --- | ---: | ---: |",
          ]
          lines.extend(
              f"| `{row['file']}` | {row['bytes'] / 1024:.1f} | {row['gzipBytes'] / 1024:.1f} |"
              for row in rows
          )
          summary = "\n".join(lines) + "\n"
          pathlib.Path("bundle-report.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)

          if not total_ok:
              print(
                  f"::error::Bundle size ({total_kb:.1f} KB) exceeds "
                  f"budget ({frontend['totalBundleSizeKb']} KB)"
              )
              sys.exit(1)
          PY

      - name: Upload bundle analysis report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis-${{ github.run_number }}
          path: |
            apps/desktop/dist/bundle-stats.html
            bundle-report.json
            bundle-report.md
          if-no-files-found: warn
          retention-days: 90
