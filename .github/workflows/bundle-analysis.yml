name: Bundle Analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'scripts/perf/check-bundle.mjs'
      - 'scripts/perf/check-bundle.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'perf-budget.json'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/workflows/bundle-analysis.yml'

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-analysis:
    name: Analyze Frontend Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Frontend bundle analysis does not need Rust or native Tauri packages.
      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify bundle reporting contract
        run: node --test scripts/perf/check-bundle.test.mjs

      - name: Build with bundle analysis
        run: pnpm --filter @tracepilot/desktop build --mode analyze

      - name: Measure and report bundle sizes
        shell: bash
        run: |
          node scripts/perf/check-bundle.mjs \
            --dist=apps/desktop/dist \
            --budget=perf-budget.json \
            --output=bundle-report.json \
            --summary=bundle-report.md 2>&1 | tee bundle-contract.log
          cat bundle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle analysis report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis-${{ github.run_number }}
          path: |
            apps/desktop/dist/bundle-stats.html
            bundle-report.json
            bundle-report.md
            bundle-contract.log
          if-no-files-found: warn
          retention-days: 90
