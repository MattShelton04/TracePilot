name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    # Shared-runner timings are retained for diagnosis, not used as PR gates.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Discover benchmark suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
      cache-suite: ${{ steps.suites.outputs.cache-suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read declared Cargo benchmark targets
        id: suites
        shell: python
        run: |
          import json, os, re, tomllib
          with open("crates/tracepilot-bench/Cargo.toml", "rb") as manifest:
              suites = [bench["name"] for bench in tomllib.load(manifest)["bench"]]
          assert suites and len(suites) == len(set(suites)), "Benchmark suites must be nonempty and unique"
          assert all(re.fullmatch(r"[A-Za-z0-9_-]+", suite) for suite in suites), "Invalid benchmark suite name"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"suites={json.dumps(suites)}\ncache-suite={suites[0]}\n")

  benchmark:
    name: Criterion (${{ matrix.suite }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.prepare.outputs.suites) }}
    env:
      BENCHMARK_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: benchmark-release
          # Every suite has the same dependency graph. One writer avoids cache
          # upload races and keeps all PR comparisons on the same main cache.
          save-cache: ${{ matrix.suite == needs.prepare.outputs.cache-suite }}

      - name: Prepare measurements and record compiler provenance
        run: |
          # Measurements are per run; no old Criterion data may survive a
          # cache restore or satisfy the required-results contract.
          rm -rf target/criterion
          mkdir -p target/criterion
          rustc --version > "target/criterion/${BENCHMARK_SUITE}-rustc-version.txt"

      - name: Warm release probe dependencies for PR comparisons
        if: matrix.suite == needs.prepare.outputs.cache-suite
        run: cargo build --locked --release -p tracepilot-bench --example index_probe --example performance_probe

      - name: Run benchmark suite
        id: measurement
        shell: bash
        run: |
          cargo bench --locked -p tracepilot-bench --bench "$BENCHMARK_SUITE" \
            2>&1 | tee "target/criterion/${BENCHMARK_SUITE}-bench.log"

      - name: Record suite outcome for partial diagnostics
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.measurement.outcome }}
        run: |
          mkdir -p target/criterion
          printf '%s\n' "$BENCHMARK_OUTCOME" > "target/criterion/${BENCHMARK_SUITE}-outcome.txt"

      - name: Upload suite results and HTML reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-suite-${{ matrix.suite }}
          path: target/criterion
          if-no-files-found: error
          retention-days: 90

  summary:
    name: Validate and summarize benchmarks
    needs: [prepare, benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify benchmark result contract
        id: contracts
        run: node --test scripts/perf/check-budgets.test.mjs scripts/perf/summarize-benchmarks.test.mjs

      - name: Download suite measurements
        id: download
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: criterion-suite-*
          path: target/criterion
          merge-multiple: true

      - name: Validate and summarize required results
        if: ${{ !cancelled() }}
        env:
          BENCHMARK_SUITES: ${{ needs.prepare.outputs.suites }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          BENCHMARK_DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          BENCHMARK_CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        run: |
          node scripts/perf/summarize-benchmarks.mjs \
            --criterion=target/criterion \
            --budget=perf-budget.json \
            --output=benchmark-output.json \
            --summary=benchmark-summary.md \
            --log=benchmark-contract.log

      - name: Upload Criterion reports and machine-readable summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-v2-nonempty-fixtures-${{ github.run_number }}
          path: |
            benchmark-output.json
            benchmark-summary.md
            benchmark-contract.log
          if-no-files-found: warn
          retention-days: 90
