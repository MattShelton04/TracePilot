name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    # Shared-runner timings are retained for diagnosis, not used as PR gates.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Criterion Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: benchmark-release
          save-cache: "true"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify benchmark result contract
        run: node --test scripts/perf/check-budgets.test.mjs

      - name: Run benchmarks
        run: cargo bench -p tracepilot-bench

      - name: Validate and summarize required results
        shell: bash
        run: |
          node scripts/perf/check-budgets.mjs \
            --criterion=target/criterion \
            --budget=perf-budget.json \
            --output=benchmark-output.json \
            --summary=benchmark-summary.md 2>&1 | tee benchmark-contract.log
          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Criterion reports and machine-readable summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-v2-nonempty-fixtures-${{ github.run_number }}
          path: |
            target/criterion
            benchmark-output.json
            benchmark-summary.md
            benchmark-contract.log
          if-no-files-found: warn
          retention-days: 90
