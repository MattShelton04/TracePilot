name: Setup Node and pnpm
description: Install Node, pnpm, dependencies, and a restore-first pnpm store cache

inputs:
  save-cache:
    description: Save a new pnpm store cache when running on main
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
        package-manager-cache: false

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Restore and save are separate so PRs can consume main's cache without
    # creating large, PR-scoped entries that no other branch can reuse.
    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-v9-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-v9-

    - name: Install pnpm dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save pnpm store
      if: >-
        inputs.save-cache == 'true' &&
        github.ref == 'refs/heads/main' &&
        github.event_name != 'pull_request' &&
        steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-v9-${{ hashFiles('pnpm-lock.yaml') }}
