name: Setup Node and pnpm
description: Install Node, pnpm, dependencies, and a restore-first pnpm store cache

inputs:
  working-directory:
    description: Checkout directory containing package.json and pnpm-lock.yaml
    required: false
    default: "."
  save-cache:
    description: Save a new pnpm store cache when running on main
    required: false
    default: "false"
  install-filter:
    description: Optional pnpm workspace selector (for example @tracepilot/site...)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        # Comparison jobs install a different revision from the harness. Use
        # that checkout's packageManager pin instead of forcing the head pin.
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.working-directory }}/.node-version
        package-manager-cache: false

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        # Filtered installs must not lock an incomplete store into the full
        # workspace's immutable key. They can still restore that larger store.
        # Current filtered callers are restore-only and use the all-store
        # fallback. Separate scope keys guard future callers enabling saves.
        scope=$(node -e 'const {createHash}=require("node:crypto"); const filter=process.env.INSTALL_FILTER; console.log(filter ? "filter-"+createHash("sha256").update(filter).digest("hex").slice(0,16) : "all")')
        echo "scope=$scope" >> "$GITHUB_OUTPUT"

    # Restore and save are separate so PRs can consume main's cache without
    # creating large, PR-scoped entries that no other branch can reuse.
    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-v10-${{ steps.pnpm-store.outputs.scope }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-v10-${{ steps.pnpm-store.outputs.scope }}-
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-v10-all-

    - name: Install pnpm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [ -n "$INSTALL_FILTER" ]; then
          pnpm --filter "$INSTALL_FILTER" install --frozen-lockfile
        else
          pnpm install --frozen-lockfile
        fi

    - name: Save pnpm store
      if: >-
        inputs.save-cache == 'true' &&
        github.ref == 'refs/heads/main' &&
        github.event_name != 'pull_request' &&
        steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-v10-${{ steps.pnpm-store.outputs.scope }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
