name: Setup Tauri Linux dependencies
description: Install native Linux packages required to compile Tauri crates

runs:
  using: composite
  steps:
    - name: Install Tauri system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf
